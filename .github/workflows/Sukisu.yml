name: "Build Sukisu"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
        
jobs:
  build-kernels:
    name: "🐎 Build YASK ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-YASK-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
        
    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 📐 Setup SWAP 10GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 10
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          
          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Update build config constants
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          # Helper
          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          # Apply patches
          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: "🔧 Setup SukiSU-Ultra with SUSFS"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          # Clean existing installations
          rm -rf ./KernelSU ./drivers/kernelsu ./SukiSU-Ultra

          echo "📦 Installing SukiSU-Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

          # setup.sh clones as 'KernelSU' — rename it
          if [ -d "KernelSU" ] && [ ! -d "SukiSU-Ultra" ]; then
            mv KernelSU SukiSU-Ultra
            echo "✔ Renamed KernelSU → SukiSU-Ultra"
          fi

          [ -d "SukiSU-Ultra" ] || { echo "❌ SukiSU-Ultra not found!"; exit 1; }
          echo "✔ SukiSU-Ultra ready"

          # Verify SukiSU-Ultra kernel entry point
          INIT_C="SukiSU-Ultra/kernel/core/init.c"
          [ -f "$INIT_C" ] || {
            echo "❌ ERROR: $INIT_C not found! Listing SukiSU-Ultra/kernel/:"
            ls -la SukiSU-Ultra/kernel/ || true
            exit 1
          }
          echo "✔ Found entry point: $INIT_C"

          # Fix drivers/kernelsu symlink — always force recreate with absolute path
          KERNEL_SRC_ABS="$(realpath SukiSU-Ultra/kernel)"
          rm -rf drivers/kernelsu
          ln -sf "$KERNEL_SRC_ABS" drivers/kernelsu
          echo "✔ Symlink: drivers/kernelsu → $(readlink -f drivers/kernelsu)"

          # Verify Makefile is reachable through symlink
          if [ ! -f "drivers/kernelsu/Makefile" ]; then
            echo "❌ ERROR: drivers/kernelsu/Makefile not found!"
            echo "Absolute path used: $KERNEL_SRC_ABS"
            ls -la "$KERNEL_SRC_ABS"
            exit 1
          fi
          echo "✔ drivers/kernelsu/Makefile verified"

          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          [ -d "susfs4ksu" ] || { echo "❌ SUSFS clone failed!"; exit 1; }

          # Apply SUSFS kernel patch
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            echo "🔧 Applying SUSFS kernel patch..."
            patch -p1 --forward < "$SUSFS_PATCH" && echo "✅ SUSFS patch applied" || echo "⚠️ Patch had issues, continuing..."
          else
            echo "⚠️ SUSFS patch not found: $SUSFS_PATCH"
          fi

          # Copy SUSFS source files
          echo "📄 Installing SUSFS source files..."
          mkdir -p fs include/linux

          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c \
            && echo "✔ Copied fs/susfs.c" \
            || { echo "❌ fs/susfs.c missing!"; exit 1; }

          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h \
            && echo "✔ Copied include/linux/susfs.h" \
            || { echo "❌ susfs.h missing!"; exit 1; }

          [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ] && \
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h && \
            echo "✔ Copied susfs_def.h" || echo "⚠️ susfs_def.h not found, skipping"

          # Copy SUSFS KSU integration files
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* SukiSU-Ultra/kernel/ || true
            echo "✔ Copied SUSFS integration files to SukiSU-Ultra/kernel/"
          fi

          # Apply KSU SUSFS patch
          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            (
              cd SukiSU-Ultra
              patch -p1 --forward < "../$KSU_PATCH" && echo "✔ KSU SUSFS patch applied" || echo "⚠️ KSU patch had issues, continuing..."
            )
          fi

          # Add KSU (Inline Hook) and SUSFS configs — NO leading spaces (critical!)
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_INLINE_HOOK=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          echo "✔ KSU + SUSFS configs added"

          # Cleanup
          rm -rf susfs4ksu
          echo "🎉 SukiSU-Ultra with SUSFS fully integrated!"

      - name: "⚙️ Setup basic configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # addon configs — NO leading spaces (critical!)
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          EOF
          echo "✅ Basic configs added"

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
          echo "Custom Makefile line added successfully"

      - name: "🔧 Fix ksu_late_loaded declaration"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          INIT_C="drivers/kernelsu/core/init.c"
          if [ ! -f "$INIT_C" ]; then
            echo "⚠️ $INIT_C not found, skipping"
            exit 0
          fi

          # Remove any previously-injected (possibly misplaced) definition
          if grep -q "YASK_KSU_LATE_LOADED_DEF" "$INIT_C"; then
            sed -i '/YASK_KSU_LATE_LOADED_DEF/,+1d' "$INIT_C"
          fi

          ANCHOR_LINE=$(grep -n '#include "infra/symbol_resolver.h"' "$INIT_C" | head -1 | cut -d: -f1)
          if [ -z "$ANCHOR_LINE" ]; then
            echo "❌ Anchor include not found, falling back to first line"
            ANCHOR_LINE=0
          fi

          sed -i "${ANCHOR_LINE}a\\
          \\
          /* YASK_KSU_LATE_LOADED_DEF */\\
          bool ksu_late_loaded = false;" "$INIT_C"

          grep -n "YASK_KSU_LATE_LOADED_DEF" "$INIT_C" || { echo "❌ Definition not present!"; exit 1; }

      - name: "🔍 Debug init.c context"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          INIT_C="drivers/kernelsu/core/init.c"
          echo "--- Lines 1-60 ---"
          sed -n '1,60p' "$INIT_C"
          echo "--- Lines 120-140 ---"
          sed -n '120,140p' "$INIT_C"
          echo "--- Lines 180-195 ---"
          sed -n '180,195p' "$INIT_C"

      - name: "🔍 Debug ksu_late_loaded occurrences"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: grep -rn "ksu_late_loaded" drivers/kernelsu/ include/ || true

      - name: "🔍 Debug app_profile.c context"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          FILE="drivers/kernelsu/policy/app_profile.c"
          echo "--- Lines 150-195 ---"
          sed -n '150,195p' "$FILE"
          echo "--- Check .rej files ---"
          find drivers/kernelsu -name "*.rej" -exec sh -c 'echo "=== {} ==="; cat "{}"' \;

      - name: "🔍 Debug app_profile.c function start"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          FILE="drivers/kernelsu/policy/app_profile.c"
          sed -n '100,182p' "$FILE"

      - name: "🔧 Fix missing p,t declaration in app_profile.c"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          FILE="drivers/kernelsu/policy/app_profile.c"
          if [ ! -f "$FILE" ]; then
            echo "⚠️ $FILE not found, skipping"
            exit 0
          fi

          if grep -q "YASK_PT_DECL" "$FILE"; then
            echo "✔ already patched"
          else
            sed -i 's/struct user_struct \*new_user;/struct user_struct *new_user;\n    struct task_struct *p = current, *t; \/* YASK_PT_DECL *\//' "$FILE"
          fi

          grep -n "YASK_PT_DECL" "$FILE" || { echo "❌ patch failed!"; exit 1; }


      - name: "🔧 Fix dispatch.c SUSFS constants"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          DISPATCH_C="drivers/kernelsu/supercall/dispatch.c"

          # Remove any previously misplaced includes (inside #ifdef CONFIG_KPM)
          sed -i '/^#include <linux\/susfs_def.h>$/d;/^#include <linux\/susfs.h>$/d' "$DISPATCH_C"

          # Insert after the last top-level #include line (before any #ifdef block)
          ANCHOR=$(awk '/^#include/{l=NR} /^#ifdef/{if(l)exit} END{print l}' "$DISPATCH_C")
          sed -i "${ANCHOR}a #include <linux/susfs_def.h>\n#include <linux/susfs.h>" "$DISPATCH_C"

          echo "--- Result around includes ---"
          head -30 "$DISPATCH_C"



      
      - name: "🔍 Verify susfs includes in dispatch.c"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "--- grep susfs includes in dispatch.c ---"
          grep -n "susfs" drivers/kernelsu/supercall/dispatch.c
          echo "--- CONFIG_KSU_SUSFS in defconfig ---"
          grep "CONFIG_KSU_SUSFS" arch/arm64/configs/gki_defconfig
          echo "--- check for #ifdef CONFIG_KSU_SUSFS around SUSFS_MAGIC usage ---"
          sed -n '440,460p' drivers/kernelsu/supercall/dispatch.c

      - name: "🔍 Debug susfs_def.h content and dispatch.c includes"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "--- susfs_def.h (first 30 lines) ---"
          head -30 include/linux/susfs_def.h
          echo "--- dispatch.c includes after fix ---"
          head -25 drivers/kernelsu/supercall/dispatch.c
          echo "--- susfs.h includes ---"
          head -15 include/linux/susfs.h

      - name: "🧹 Clear ccache for kernelsu"
        if: matrix.kernel.enable_ksu == true
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -z
            echo "CCACHE stats reset"
          fi
          # Some build.sh scripts set CCACHE_DIR via env; clear it if present
          if [ -n "$CCACHE_DIR" ] && [ -d "$CCACHE_DIR" ]; then
            rm -rf "$CCACHE_DIR"
            echo "Cleared CCACHE_DIR: $CCACHE_DIR"
          fi
          rm -rf ~/.ccache

      - name: "🧹 Clean build output directory"
        working-directory: ${{ env.WORK_DIR }}
        run: rm -rf out

      - name: "🔍 Verify dispatch.c content right before build"
        if: matrix.kernel.enable_ksu == true
        run: |
          FILE="${{ env.WORK_DIR }}/${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/drivers/kernelsu/supercall/dispatch.c"
          echo "File: $FILE"
          md5sum "$FILE"
          sed -n '25,30p' "$FILE"


      - name: "🔍 Debug missing kernelsu source files"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "--- drivers/kernelsu top-level structure ---"
          find drivers/kernelsu -maxdepth 2 -type d | sort
          echo "--- search for ksu_syscall_hook_init definition ---"
          grep -rn "ksu_syscall_hook_init\b" drivers/kernelsu/ | grep -v "\.h:"
          echo "--- search for ksu_init_symbol_resolver definition ---"
          grep -rn "ksu_init_symbol_resolver\b" drivers/kernelsu/ | grep -v "\.h:"
          echo "--- search for find_kernel_symbol_exact definition ---"
          grep -rn "find_kernel_symbol_exact\b" drivers/kernelsu/ | grep -v "\.h:"
          echo "--- drivers/kernelsu/Makefile content ---"
          cat drivers/kernelsu/Makefile


      - name: "🔍 Debug Makefile patch leftovers"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "--- Makefile.orig (full) ---"
          cat -L drivers/kernelsu/Makefile.orig 2>/dev/null || find -L drivers/kernelsu -name "Makefile.orig" -exec cat {} \;
          echo "--- Makefile.rej (if exists) ---"
          find -L drivers/kernelsu -name "Makefile.rej" -exec sh -c 'echo "=== {} ==="; cat "{}"' \;
          echo "--- diff current vs orig ---"
          diff $(find -L drivers/kernelsu -name "Makefile.orig") drivers/kernelsu/Makefile || true
          
    
      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 Create release package"
        run: |
          set -e

          # Clone AnyKernel3
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3

          # Copy kernel images
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Create banner
          cat > AnyKernel3/banner << 'EOF'
          ╔═════════════════════════════════════════════════════╗
          ║                                                     ║
          ║          ██╗   ██╗ █████╗ ███████╗██╗  ██╗          ║
          ║          ╚██╗ ██╔╝██╔══██╗██╔════╝██║ ██╔╝          ║
          ║           ╚████╔╝ ███████║███████╗█████╔╝           ║
          ║            ╚██╔╝  ██╔══██║╚════██║██╔═██╗           ║
          ║             ██║   ██║  ██║███████║██║  ██╗          ║
          ║             ╚═╝   ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝          ║
          ║                                                     ║
          ║               Yet Another Stock Kernel              ║
          ║                   by @belowzeroiq                   ║
          ║                                                     ║
          ║              Powered by Github Actions              ║
          ║                                                     ║
          ╠═════════════════════════════════════════════════════╣
          ║                                                     ║
          ║     Features:                                       ║
          ║     • Full LTO + -O2 Optimization                   ║
          ║     • Extra TCP Congestion (BBR, Westwood)          ║
          ║     • AOSP clang-r547379                            ║
          ║     • Non-KSU & Wild-KSU support                    ║
          ║     • SUSFS integration (for KSU builds)            ║
          ║     • Baseband-Guard Support                        ║
          ║     • Metamodule Support                            ║
          ║                                                     ║
          ║     Info:                                           ║
          ║     • Supported Android: 13-16                      ║
          ║     • Supported Device:                             ║
          ║       Redmi Note 12 4G/NFC                          ║
          ║       Redmi Note 13 4G/NFC                          ║
          ║       Redmi Pad SE                                  ║
          ║                                                     ║
          ║     Please ensure:                                  ║
          ║     • Your device is compatible                     ║
          ║     • You have a backup of your current kernel      ║
          ║                                                     ║
          ╚═════════════════════════════════════════════════════╝
          Installing YASK Kernel...
          EOF

          # Create ZIP
          ZIP_NAME="Anykernel3_YASK-WildKSU-AIO-FULL_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Package created: $ZIP_NAME"

      - name: "⬆️ Upload to GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "YASK-NEXT"

      - name: "📱 Send Telegram Notification"
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/YASK-NEXT"
          BANNER_URL="https://raw.githubusercontent.com/topnotchfreaks/kernel_msm-5.15/builder/assets/yask.png"

          if [[ "${{ job.status }}" == "success" ]]; then
            MESSAGE="✅ *YASK Kernel Released*

          📦 *Build Information:*
          • Kernel: \`Linux 5.15\`
          • Android: \`13-16\`
          • Base: \`GKI & CLO\`
          • KSU: \`Wild KSU (canary)\`
          • SUSFS: \`Enabled (GKI A13-5.15)\`
          • LTO: \`Full\`
          • Optimization: \`-O2\`
          • BBG: \`Enabled\`

          📱 *Supported Devices:*
          • Redmi Note 12 4G/NFC
          • Redmi Note 13 4G/NFC
          • Redmi Pad SE

          📱 *Supported Manager:*
          • KSU by tiann
          • KSU by sidex15
          • Wild-KSU
          • KernelSU-Next
          • Rissu-KSU
          • KowSU

          🕐 *Build Date:* $(date '+%Y-%m-%d %H:%M:%S UTC')
          📦 *Package:* \`${{ env.ZIP_NAME }}\`

          ⬇️ [Download Here]($RELEASE_URL)"

            curl -s -X POST \
              -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
              -d photo="${BANNER_URL}" \
              --data-urlencode "caption=${MESSAGE}" \
              -d parse_mode="Markdown" \
              -d disable_web_page_preview="false" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_YASK_BOT_TOKEN }}/sendPhoto"

          else
            FAILURE_MSG="❌ *YASK Kernel Build Failed*
            
          📦 *Build Information:*
          • Kernel: \`Linux 5.15\`
          • Android: \`13-16\`
          • Base: \`GKI & CLO\`
          • KSU: \`Wild KSU (canary)\`
          • SUSFS: \`Enabled (GKI A13-5.15)\`
          • LTO: \`Full\`
          • Optimization: \`-O2\`
          • BBG: \`Enabled\`
          
          🕐 *Failed at:* $(date '+%Y-%m-%d %H:%M:%S UTC')

          🔍 Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
           
            curl -s -X POST \
              -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
              -d photo="${BANNER_URL}" \
              --data-urlencode "caption=${FAILURE_MSG}" \
              -d parse_mode="Markdown" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_YASK_BOT_TOKEN }}/sendPhoto"
          fi
