name: "Build TEST"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
        
jobs:
  build-kernels:
    name: "🐎 Build YASK ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-YASK-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
        
    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 pahole dwarves

      - name: 📐 Setup SWAP 10GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 10
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global http.version HTTP/1.1
      
          for i in {1..5}; do
            git clone \
              --depth=1 \
              --filter=blob:none \
              --single-branch \
              --branch ${{ env.KERNEL_BRANCH }} \
              ${{ env.KERNEL_REPO }} \
              ${{ env.KERNEL_NAME }} && break
      
            echo "Retry $i/5"
            rm -rf ${{ env.KERNEL_NAME }}
            sleep 30
          done

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          
          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Update build config constants
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          # Helper
          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          # Apply patches
          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: "🔧 Setup SukiSU-Ultra with SUSFS"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          # Clean existing installations
          rm -rf ./KernelSU ./drivers/kernelsu ./SukiSU-Ultra

          echo "📦 Installing SukiSU-Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # setup.sh clones as 'KernelSU' — rename it
          if [ -d "KernelSU" ] && [ ! -d "SukiSU-Ultra" ]; then
            mv KernelSU SukiSU-Ultra
            echo "✔ Renamed KernelSU → SukiSU-Ultra"
          fi

          [ -d "SukiSU-Ultra" ] || { echo "❌ SukiSU-Ultra not found!"; exit 1; }
          echo "✔ SukiSU-Ultra ready"

          # Verify SukiSU-Ultra kernel entry point
          INIT_C="SukiSU-Ultra/kernel/core/init.c"
          [ -f "$INIT_C" ] || {
            echo "❌ ERROR: $INIT_C not found! Listing SukiSU-Ultra/kernel/:"
            ls -la SukiSU-Ultra/kernel/ || true
            exit 1
          }
          echo "✔ Found entry point: $INIT_C"

          # Fix drivers/kernelsu symlink — always force recreate with absolute path
          KERNEL_SRC_ABS="$(realpath SukiSU-Ultra/kernel)"
          rm -rf drivers/kernelsu
          ln -sf "$KERNEL_SRC_ABS" drivers/kernelsu
          echo "✔ Symlink: drivers/kernelsu → $(readlink -f drivers/kernelsu)"

          # Verify Makefile is reachable through symlink
          if [ ! -f "drivers/kernelsu/Makefile" ]; then
            echo "❌ ERROR: drivers/kernelsu/Makefile not found!"
            echo "Absolute path used: $KERNEL_SRC_ABS"
            ls -la "$KERNEL_SRC_ABS"
            exit 1
          fi
          echo "✔ drivers/kernelsu/Makefile verified"

          # Fix Kconfig recursive dependency
          echo "🔧 Fixing Kconfig recursive dependency..."
          KCONFIG_FILE="SukiSU-Ultra/kernel/Kconfig"
          if [ ! -f "$KCONFIG_FILE" ]; then
            echo "⚠️ Kconfig not at SukiSU-Ultra/kernel/Kconfig, searching..."
            KCONFIG_FILE="$(find SukiSU-Ultra -name 'Kconfig' | head -1)"
          fi

          if [ -f "$KCONFIG_FILE" ]; then
            echo "✔ Found Kconfig at: $KCONFIG_FILE"
            sed -i 's/depends on KSU_MANUAL_HOOK/depends on KSU/g' "$KCONFIG_FILE"
            echo "✔ Kconfig recursive dependency fixed"
            echo "🔍 Verifying fix:"
            grep -n "KSU_SUSFS\|KSU_MANUAL_HOOK" "$KCONFIG_FILE" | head -20 || true
          else
            echo "❌ Kconfig not found anywhere in SukiSU-Ultra!"
            find SukiSU-Ultra -name "Kconfig" | head -10
            exit 1
          fi

          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          [ -d "susfs4ksu" ] || { echo "❌ SUSFS clone failed!"; exit 1; }

          # Apply SUSFS kernel patch
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            echo "🔧 Applying SUSFS kernel patch..."
            patch -p1 --forward < "$SUSFS_PATCH" && echo "✅ SUSFS patch applied" || echo "⚠️ Patch had issues, continuing..."
          else
            echo "⚠️ SUSFS patch not found: $SUSFS_PATCH"
          fi

          # Add all required SukiSU-Ultra hooks
          echo "🔧 Adding all required SukiSU-Ultra hooks..."
          python3 << 'PYEOF'
          import os
          
          # fs/stat.c hooks
          with open('fs/stat.c', 'r') as f:
              content = f.read()
          
          if 'ksu_handle_newfstat_ret' not in content:
              content = content.replace(
                  'SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)',
                  'extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\nSYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)'
              )
              content = content.replace(
                  'SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n{\n\treturn cp_new_stat',
                  'SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n{\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n\treturn cp_new_stat'
              )
              print("✔ Added ksu_handle_newfstat_ret to fs/stat.c")
          else:
              print("✔ ksu_handle_newfstat_ret already present")
          
          if 'ksu_handle_fstat64_ret' not in content:
              content = content.replace(
                  'SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)',
                  'extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\nSYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)'
              )
              print("✔ Added ksu_handle_fstat64_ret to fs/stat.c")
          else:
              print("✔ ksu_handle_fstat64_ret already present")
          
          with open('fs/stat.c', 'w') as f:
              f.write(content)
          
          # kernel/sys.c or kernel/reboot.c hooks
          with open('kernel/sys.c', 'r') as f:
              content = f.read()
          
          if 'ksu_handle_setresuid' not in content:
              content = content.replace(
                  'SYSCALL_DEFINE3(setresuid,',
                  'extern int ksu_handle_setresuid(uid_t *ruid, uid_t *euid, uid_t *suid);\nSYSCALL_DEFINE3(setresuid,'
              )
              content = content.replace(
                  'SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)\n{',
                  'SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)\n{\n\tksu_handle_setresuid(&ruid, &euid, &suid);'
              )
              print("✔ Added ksu_handle_setresuid to kernel/sys.c")
          else:
              print("✔ ksu_handle_setresuid already present")
          
          with open('kernel/sys.c', 'w') as f:
              f.write(content)
          
          # ksu_handle_sys_reboot
          target = 'kernel/reboot.c' if os.path.exists('kernel/reboot.c') else 'kernel/sys.c'
          with open(target, 'r') as f:
              content = f.read()
          
          if 'ksu_handle_sys_reboot' not in content:
              content = content.replace(
                  'SYSCALL_DEFINE4(reboot,',
                  'extern int ksu_handle_sys_reboot(int *magic1, int *magic2, unsigned int *cmd, void __user **arg);\nSYSCALL_DEFINE4(reboot,'
              )
              content = content.replace(
                  'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd, void __user *, arg)\n{',
                  'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd, void __user *, arg)\n{\n\tksu_handle_sys_reboot(&magic1, &magic2, &cmd, &arg);'
              )
              print(f"✔ Added ksu_handle_sys_reboot to {target}")
          else:
              print("✔ ksu_handle_sys_reboot already present")
          
          with open(target, 'w') as f:
              f.write(content)
          
          # drivers/input/input.c hook
          with open('drivers/input/input.c', 'r') as f:
              content = f.read()
          
          if 'ksu_handle_input_handle_event' not in content:
              content = content.replace(
                  'static void input_handle_event(struct input_dev *dev,',
                  'extern bool ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\nstatic void input_handle_event(struct input_dev *dev,'
              )
              content = content.replace(
                  'static void input_handle_event(struct input_dev *dev,\n\t\t\t     unsigned int type, unsigned int code, int value)\n{',
                  'static void input_handle_event(struct input_dev *dev,\n\t\t\t     unsigned int type, unsigned int code, int value)\n{\n\tif (ksu_handle_input_handle_event(&type, &code, &value)) return;'
              )
              print("✔ Added ksu_handle_input_handle_event to drivers/input/input.c")
          else:
              print("✔ ksu_handle_input_handle_event already present")
          
          with open('drivers/input/input.c', 'w') as f:
              f.write(content)
          PYEOF
          echo "🔍 Verifying all hooks were added..."
          grep -l "ksu_handle_setresuid" kernel/sys.c && echo "✔ setresuid hook present" || echo "❌ setresuid hook MISSING"
          grep -l "ksu_handle_sys_reboot" kernel/reboot.c kernel/sys.c 2>/dev/null && echo "✔ reboot hook present" || echo "❌ reboot hook MISSING"
          grep -l "ksu_handle_input_handle_event" drivers/input/input.c && echo "✔ input hook present" || echo "❌ input hook MISSING"
          grep -l "ksu_handle_newfstat_ret" fs/stat.c && echo "✔ newfstat hook present" || echo "❌ newfstat hook MISSING"
          grep -l "ksu_handle_fstat64_ret" fs/stat.c && echo "✔ fstat64 hook present" || echo "❌ fstat64 hook MISSING"



          # Copy SUSFS source files
          echo "📄 Installing SUSFS source files..."
          mkdir -p fs include/linux

          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c \
            && echo "✔ Copied fs/susfs.c" \
            || { echo "❌ fs/susfs.c missing!"; exit 1; }

          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h \
            && echo "✔ Copied include/linux/susfs.h" \
            || { echo "❌ susfs.h missing!"; exit 1; }

          [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ] && \
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h && \
            echo "✔ Copied susfs_def.h" || echo "⚠️ susfs_def.h not found, skipping"

            # Fix ksu_late_loaded undeclared identifier
            echo "🔧 Fixing ksu_late_loaded declaration..."
            INIT_C="SukiSU-Ultra/kernel/core/init.c"
            if grep -q "ksu_late_loaded" "$INIT_C"; then
              if ! grep -q "bool ksu_late_loaded" "$INIT_C"; then
                # Insert declaration at the top of the file after includes
                sed -i '/^#include/!b; /^#include/{h;d}; /^[[:space:]]*$/{G;s/\n\(.*\)/\1\nbool ksu_late_loaded = false;/;b}' "$INIT_C" || true
                # Simpler fallback: just prepend to the file
                if ! grep -q "bool ksu_late_loaded" "$INIT_C"; then
                  echo 'bool ksu_late_loaded = false;' > /tmp/ksu_fix.c
                  cat "$INIT_C" >> /tmp/ksu_fix.c
                  mv /tmp/ksu_fix.c "$INIT_C"
                fi
                echo "✔ Fixed ksu_late_loaded declaration in init.c"
              else
                echo "✔ ksu_late_loaded already declared"
              fi
            fi
          
          # Copy SUSFS KSU integration files
           

          # Apply KSU SUSFS patch
          

          # Add KSU and SUSFS configs — NO leading spaces (critical!)
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          sed -i 's/^[[:space:]]*//' "$CONFIG_FILE"
          echo "✔ KSU + SUSFS configs added"

          # Cleanup
          rm -rf susfs4ksu
          echo "🎉 SukiSU-Ultra with SUSFS fully integrated!"

      - name: "⚙️ Setup basic configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # addon configs — NO leading spaces (critical!)
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          EOF
          sed -i 's/^[[:space:]]*//' "$CONFIG_FILE"
          echo "✅ Basic configs added"

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
          echo "Custom Makefile line added successfully"

      - name: "Debug SukiSU-Ultra hooks"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "===== MANUAL HOOK SETTINGS ====="
          grep -R "KSU_MANUAL_HOOK" SukiSU-Ultra 2>/dev/null || true
      
          echo "===== MISSING HOOK ====="
          grep -R "ksu_handle_newfstat_ret" SukiSU-Ultra . -n || true
      
          echo "===== STAT FUNCTIONS ====="
          grep -R "newfstat" fs include kernel -n || true
      
          echo "===== EXISTING KSU HOOKS ====="
          grep -R "ksu_handle_stat" . -n || true
          grep -R "ksu_handle_execveat" . -n || true

      - name: "🔍 Debug required hooks"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "=== All required hooks by SukiSU-Ultra ==="
          grep -r "You lost" SukiSU-Ultra/kernel/tools/ || true
          echo ""
          echo "=== All hooks being checked ==="
          grep -r "check_ksu_hook" SukiSU-Ultra/kernel/tools/manual_hook_check.mk || true
          echo ""
          echo "=== Hooks present in kernel source ==="
          grep -r "ksu_handle_" fs/ --include="*.c" -l || true
    
      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 Create release package"
        run: |
          set -e

          # Clone AnyKernel3
          git clone --depth=1 https://github.com/sajids12bd/AnyKernel3 -b master AnyKernel3

          # Copy kernel images
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Create ZIP
          ZIP_NAME="Anykernel3_YASK-SukiSU-Ultra-CLO_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Package created: $ZIP_NAME"

      - name: "⬆️ Upload to GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "YASK-NEXT"

      - name: "📱 Send Telegram Notification"
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/YASK-NEXT"
          BANNER_URL="https://raw.githubusercontent.com/topnotchfreaks/kernel_msm-5.15/builder/assets/yask.png"

          if [[ "${{ job.status }}" == "success" ]]; then
            MESSAGE="✅ *YASK Kernel Released*

          📦 *Build Information:*
          • Kernel: \`Linux 5.15\`
          • Android: \`13-16\`
          • Base: \`GKI & CLO\`
          • KSU: \`SukiSU-Ultra\`
          • SUSFS: \`Enabled (GKI A13-5.15)\`
          • LTO: \`Full\`
          • Optimization: \`-O2\`
          • BBG: \`Enabled\`

          📱 *Supported Devices:*
          • Redmi Note 12 4G/NFC
          • Redmi Note 13 4G/NFC
          • Redmi Pad SE

          📱 *Supported Manager:*
          • KSU by tiann
          • KSU by sidex15
          • Wild-KSU
          • KernelSU-Next
          • Rissu-KSU
