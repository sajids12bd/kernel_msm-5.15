name: "KernelSU-Next-SUSFS22-Build-FIXED"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_DIR: "kernel"
  CLANG_VERSION: "r547379"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 1. SYSTEM SETUP
    # =========================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git curl wget zip unzip rsync bc bison flex \
          build-essential libssl-dev python3 ccache

    - name: Free disk space
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    # =========================
    # 2. CLONE KERNEL (GKI ONLY)
    # =========================
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/kernel/common \
          -b android13-5.15 \
          $KERNEL_DIR

    # =========================
    # 3. CLANG TOOLCHAIN
    # =========================
    - name: Setup Clang
      run: |
        mkdir -p clang
        wget -q https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz
        tar -xf clang-r547379.tar.gz -C clang
        echo "CLANG_PATH=$PWD/clang/bin" >> $GITHUB_ENV

    # =========================
    # 4. FIXED KERNELSU NEXT (NO AUTH ERROR)
    # =========================
    - name: KernelSU Next Setup
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        set -e

        echo "Disabling git prompts..."
        export GIT_TERMINAL_PROMPT=0

        rm -rf KernelSU

        git clone --depth=1 \
          https://github.com/KernelSU/KernelSU.git \
          KernelSU

        mkdir -p drivers/kernelsu
        cp -r KernelSU/kernel/* drivers/kernelsu/

        echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
        echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/gki_defconfig

    # =========================
    # 5. SUSFS 2.2
    # =========================
    - name: SUSFS 2.2 Setup
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        set -e

        git clone --depth=1 \
          -b gki-android13-5.15 \
          https://github.com/ShirkNeko/susfs4ksu.git

        rsync -a susfs4ksu/kernel_patches/fs/ fs/
        rsync -a susfs4ksu/kernel_patches/include/linux/ include/linux/

        patch -p1 --fuzz=3 < \
          susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true

        cat <<EOF >> arch/arm64/configs/gki_defconfig
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
EOF

    # =========================
    # 6. CUSTOM PATCH SYSTEM (SAFE VERSION)
    # =========================
    - name: Apply Custom Patches (SAFE MODE)
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        set -e

        PATCHES=(
          # add your patches here
          # "https://example.com/patch1.patch"
        )

        for p in "${PATCHES[@]}"; do
          echo "Applying $p"
          curl -L -o temp.patch "$p"

          git apply temp.patch || patch -p1 --fuzz=3 < temp.patch || {
            echo "❌ Patch failed: $p"
            exit 1
          }

          rm -f temp.patch
        done

    # =========================
    # 7. OPTIMIZATION CONFIG
    # =========================
    - name: Kernel Config Tuning
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        cat <<EOF >> arch/arm64/configs/gki_defconfig

CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
CONFIG_BPF=y
CONFIG_KALLSYMS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_DEBUG_INFO_BTF=n
EOF

    # =========================
    # 8. BUILD KERNEL
    # =========================
    - name: Build Kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        set -e

        export PATH=$CLANG_PATH:$PATH
        export ARCH=arm64
        export SUBARCH=arm64

        make O=out gki_defconfig

        make -j$(nproc) O=out \
          CC=clang LLVM=1 LLVM_IAS=1 \
          2>&1 | tee build.log

    # =========================
    # 9. VERIFY OUTPUT
    # =========================
    - name: Verify Build Output
      run: |
        test -f kernel/out/arch/arm64/boot/Image || {
          echo "❌ Kernel build failed"
          exit 1
        }

    # =========================
    # 10. ANYKERNEL3 PACKAGING
    # =========================
    - name: Package Kernel
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel

        cp kernel/out/arch/arm64/boot/Image anykernel/

        cd anykernel
        zip -r9 ../KernelSU_SUSFS22.zip . -x ".git/*"
        cd ..

    # =========================
    # 11. UPLOAD ARTIFACT
    # =========================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-SUSFS22
        path: KernelSU_SUSFS22.zip

    # =========================
    # 12. RELEASE
    # =========================
    - name: GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ksun-susfs22-${{ github.run_number }}
        files: KernelSU_SUSFS22.zip
