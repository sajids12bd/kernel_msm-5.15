name: "ULTRA-KSUN-SUSFS22-Kernel"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_DIR: "kernel"
  OUT_DIR: "out"
  CLANG_VERSION: "r547379"
  CCACHE_DIR: ".ccache"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 1. SYSTEM SETUP
    # =========================
    - name: Setup dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git curl wget zip unzip rsync bc bison flex \
          build-essential libssl-dev python3 ccache

    # =========================
    # 2. CACHE (BIG SPEED BOOST)
    # =========================
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}

    # =========================
    # 3. FREE DISK
    # =========================
    - name: Free space
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    # =========================
    # 4. CLONE KERNEL (CLEAN GKI)
    # =========================
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/kernel/common \
          -b android13-5.15 \
          $KERNEL_DIR

    # =========================
    # 5. CLANG TOOLCHAIN
    # =========================
    - name: Setup Clang
      run: |
        mkdir -p clang
        wget -q https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz
        tar -xf clang-r547379.tar.gz -C clang
        echo "CLANG_PATH=$PWD/clang/bin" >> $GITHUB_ENV

    # =========================
    # 6. KERNELSU NEXT
    # =========================
    - name: KernelSU Next Setup
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        git clone --depth=1 https://github.com/KernelSU/KernelSU.git

        mkdir -p drivers/kernelsu
        cp -r KernelSU/kernel/* drivers/kernelsu/

        echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
        echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/gki_defconfig

    # =========================
    # 7. SUSFS 2.2 INTEGRATION
    # =========================
    - name: SUSFS 2.2 Setup
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        git clone --depth=1 \
          -b gki-android13-5.15 \
          https://github.com/ShirkNeko/susfs4ksu.git

        rsync -a susfs4ksu/kernel_patches/fs/ fs/
        rsync -a susfs4ksu/kernel_patches/include/linux/ include/linux/

        patch -p1 --fuzz=3 < \
          susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true

        cat <<EOF >> arch/arm64/configs/gki_defconfig
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        EOF

    # =========================
    # 8. PERFORMANCE TUNING
    # =========================
    - name: Kernel Optimizations
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        cat <<EOF >> arch/arm64/configs/gki_defconfig

        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_BPF=y
        CONFIG_KALLSYMS=y
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_DEBUG_INFO_BTF=n
        CONFIG_LTO_CLANG_FULL=y
        EOF

    # =========================
    # 9. BUILD SYSTEM
    # =========================
    - name: Build Kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        export PATH=$CLANG_PATH:$PATH
        export ARCH=arm64
        export SUBARCH=arm64

        export CC="ccache clang"
        export CXX="ccache clang++"

        export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
        export CCACHE_COMPRESS=1
        export CCACHE_MAXSIZE=2G

        ccache -z

        make O=out gki_defconfig

        make -j$(nproc) O=out \
          CC="ccache clang" \
          LLVM=1 LLVM_IAS=1 \
          2>&1 | tee build.log

        ccache -s

    # =========================
    # 10. VERIFY BUILD
    # =========================
    - name: Verify Build
      run: |
        test -f kernel/out/arch/arm64/boot/Image || {
          echo "❌ Build failed: Image missing"
          exit 1
        }

    # =========================
    # 11. ANYKERNEL3 PACKAGING
    # =========================
    - name: Package Kernel
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

        cp kernel/out/arch/arm64/boot/Image anykernel/

        ZIP="ULTRA-KSUN-SUSFS22-$(date +%Y%m%d).zip"

        cd anykernel
        zip -r9 "../$ZIP" . -x ".git/*"
        cd ..

        echo "ZIP=$ZIP" >> $GITHUB_ENV

    # =========================
    # 12. UPLOAD ARTIFACT
    # =========================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ULTRA-Kernel
        path: ${{ env.ZIP }}

    # =========================
    # 13. RELEASE
    # =========================
    - name: GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ultra-kernel-${{ github.run_number }}
        files: ${{ env.ZIP }}

    # =========================
    # 14. TELEGRAM NOTIFY
    # =========================
    - name: Telegram Notification
      if: always()
      run: |
        STATUS="${{ job.status }}"
        URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        if [ "$STATUS" = "success" ]; then
          TEXT="✅ ULTRA Kernel Build SUCCESS

📦 KernelSU Next + SUSFS 2.2
⚡ LTO + CCache enabled
📅 $(date)

🔗 $URL"
        else
          TEXT="❌ ULTRA Kernel Build FAILED

📅 $(date)

🔗 $URL"
        fi

        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="$TEXT"
