name: "Build YASK"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build-kernels:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YASK-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YAS-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches: []

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:

      - name: Setup workspace
        run: |
          mkdir -p $KERNEL_LOC_DIR
          sudo apt-get update -y
          sudo apt-get install -y git curl wget aria2 repo jq rsync

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Clone kernel
        run: |
          cd $KERNEL_LOC_DIR
          git clone --depth=1 --branch $KERNEL_BRANCH $KERNEL_REPO $KERNEL_NAME

      - name: Install toolchain
        run: |
          mkdir -p prebuilts/clang
          aria2c -x 16 -s 16 -o clang.tar.gz https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -f clang.tar.gz

      - name: Apply patches
        run: |
          cd $KERNEL_LOC_DIR/$KERNEL_NAME

          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG_NAME"
          echo "CONFIG_LOCALVERSION=\"$LOCAL_VERSION-$(date +%Y-%m-%d)\"" >> $CONFIG_FILE
          echo "CONFIG_LOCALVERSION_AUTO=n" >> $CONFIG_FILE

          for p in ${{ join(matrix.kernel.extra_patches, ' ') }}; do
            echo "Applying $p"
            curl -L -o patch.patch $p || continue
            patch -p1 < patch.patch || true
          done

      # =========================
      # RE-SUKISU / KSU SECTION
      # =========================
      - name: Setup ReSukiSU (optional)
        if: matrix.kernel.enable_ksu == true
        run: |
          set -e

          cd $KERNEL_LOC_DIR/$KERNEL_NAME

          rm -rf KernelSU Wild_KSU ReSukiSU drivers/kernelsu

          echo "Installing ReSukiSU..."
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash -s main

          if [ -d "ReSukiSU" ]; then
            KSU_DIR="ReSukiSU"
          elif [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          else
            echo "KSU install failed"
            exit 1
          fi

          echo "Using $KSU_DIR"

          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 || true

          if [ -d "susfs4ksu" ]; then
            patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true
          fi

          mkdir -p fs include/linux

          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/ || true
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ || true

          if [ -f "$KSU_DIR/kernel/ksu.c" ]; then
            sed -i '/ksu_core_init();/a \tsusfs_init();' $KSU_DIR/kernel/ksu.c || true
          fi

          ln -sf ../$KSU_DIR drivers/kernelsu || true

          cat >> arch/arm64/configs/$DEFCONFIG_NAME <<EOF
CONFIG_KSU=y
CONFIG_OVERLAY_FS=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_SU=y
EOF

      - name: Build kernel
        run: |
          cd $KERNEL_LOC_DIR/$KERNEL_NAME

          LTO=full \
          BUILD_CONFIG=build.config.gki.aarch64 \
          bash build.sh -j$(nproc)

      - name: Copy Image
        run: |
          cp out/dist/Image Image_${OUTPUT_NAME}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}
          path: Image_${{ matrix.kernel.output_name }}

  package:
    runs-on: ubuntu-latest
    needs: build-kernels

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir AnyKernel3
          cp -r artifacts/* AnyKernel3/
          zip -r kernel.zip AnyKernel3

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: kernel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
