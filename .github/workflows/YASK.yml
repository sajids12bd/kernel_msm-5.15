name: "Build YASK"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build-kernels:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YASK-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:

      - name: Setup workspace
        run: |
          mkdir -p $KERNEL_LOC_DIR
          sudo apt-get update -y
          sudo apt-get install -y git curl wget zip build-essential bc bison flex

      - name: Clone kernel
        run: |
          git clone --depth=1 --branch $KERNEL_BRANCH $KERNEL_REPO $KERNEL_LOC_DIR/$KERNEL_NAME

      # =========================
      # BBG + ReSukiSU + SUSFS FIXED BLOCK
      # =========================
      - name: Setup ReSukiSU + SUSFS + BBG
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          echo "Removing old KSU variants..."
          rm -rf KernelSU Wild_KSU ReSukiSU drivers/kernelsu

          echo "Installing ReSukiSU..."
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash -s main

          if [ -d "ReSukiSU" ]; then
            KSU_DIR="ReSukiSU"
          else
            echo "ReSukiSU install failed"
            exit 1
          fi

          echo "Cloning SUSFS..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "Applying SUSFS patch..."
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true

          mkdir -p fs include/linux

          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ || true

          cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* $KSU_DIR/kernel/ || true

          KSU_C="$KSU_DIR/kernel/ksu.c"

          if ! grep -q "susfs_init" "$KSU_C"; then
            sed -i '/ksu_core_init();/a \tsusfs_init();' "$KSU_C" || true
          fi

          ln -sf ../$KSU_DIR drivers/kernelsu || true

          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || true

          echo "CONFIG_BBG=y" >> arch/arm64/configs/$DEFCONFIG_NAME

          cat >> arch/arm64/configs/$DEFCONFIG_NAME << 'EOF'
CONFIG_KSU=y
CONFIG_OVERLAY_FS=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_SU=y
EOF

          echo "ReSukiSU + SUSFS + BBG DONE"

      - name: Build kernel
        run: |
          mkdir -p out
          export LTO=full
          build/build.sh -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/
