name: "Build YASK (ReSukiSU)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build-kernels:
    name: "🐎 Build YASK ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YASK-GKI"
            output_name: "Image.gki.rezksu"
            enable_ksu: true

          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-YASK-CLO"
            output_name: "Image.clo.rezksu"
            enable_ksu: true

          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YAS-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false

          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-YASK-CLO"
            output_name: "Image.clo.noksu"
            enable_ksu: false

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:

    # =========================
    # SETUP
    # =========================
    - name: "✨ Setup workspace"
      run: |
        mkdir -p ${{ env.KERNEL_LOC_DIR }}
        sudo apt-get update -qq
        sudo apt-get install -y repo rsync aria2 git curl jq bc

    - name: 📐 Setup Swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    # =========================
    # CLONE KERNEL
    # =========================
    - name: "🌟 Clone kernel source"
      working-directory: ./${{ env.KERNEL_LOC_DIR }}
      run: |
        git clone --depth=1 --recursive --branch ${{ env.KERNEL_BRANCH }} \
          ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }}

    # =========================
    # TOOLCHAIN
    # =========================
    - name: "🔧 Setup Clang"
      run: |
        mkdir -p prebuilts/clang
        aria2c -x 16 -s 16 -o clang.tar.gz \
          "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"

        mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
        tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
        rm -f clang.tar.gz

    # =========================
    # PATCHES
    # =========================
    - name: "🧩 Apply patches"
      working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
      run: |
        apply_patch () {
          curl -L "$1" -o patch.patch
          patch -p1 < patch.patch || true
          rm -f patch.patch
        }

        patches=(
          "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
          "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
          "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
          "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
        )

        for p in "${patches[@]}"; do
          apply_patch "$p"
        done

    # =========================
    # REZUKISU INTEGRATION (NEW)
    # =========================
    - name: "🔧 Setup ReSukiSU"
      if: matrix.kernel.enable_ksu == true
      working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
      run: |
        set -e

        rm -rf ReSukiSU KernelSU drivers/kernelsu

        echo "📦 Cloning ReSukiSU..."
        git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git

        if [ -f ReSukiSU/setup.sh ]; then
          bash ReSukiSU/setup.sh
        fi

        echo "✔ ReSukiSU installed"

    # =========================
    # SUSFS (SAFE INTEGRATION)
    # =========================
    - name: "🧩 SUSFS Integration"
      if: matrix.kernel.enable_ksu == true
      working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
      run: |
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

        PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

        if [ -f "$PATCH" ]; then
          patch -p1 < "$PATCH" || true
        fi

    # =========================
    # CONFIG
    # =========================
    - name: "⚙️ Configure kernel"
      working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
      run: |
        CFG="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

        echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}\"" >> $CFG
        echo "CONFIG_LOCALVERSION_AUTO=n" >> $CFG

        if [ "${{ matrix.kernel.enable_ksu }}" == "true" ]; then
          cat >> $CFG << EOF
CONFIG_OVERLAY_FS=y
CONFIG_KPROBES=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
EOF
        fi

    # =========================
    # BUILD
    # =========================
    - name: "🔨 Build kernel"
      working-directory: ${{ env.WORK_DIR }}
      run: |
        LTO=full \
        BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
        build/build.sh -j$(nproc --all)

    # =========================
    # PACKAGE
    # =========================
    - name: "📦 Copy kernel image"
      run: |
        cp out/dist/Image ${{ env.OUTPUT_NAME }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.kernel.name }}
        path: ${{ env.OUTPUT_NAME }}

  # =========================
  # PACKAGING STAGE
  # =========================
  package-kernels:
    runs-on: ubuntu-latest
    needs: build-kernels

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: "📦 Create AnyKernel3 ZIP"
        run: |
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3

          find artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          cd AnyKernel3
          zip -r9 ../YASK-ReSukiSU.zip .

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: "YASK-ReSukiSU"
          files: YASK-ReSukiSU.zip
