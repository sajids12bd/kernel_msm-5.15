name: "YASK Kernel Build (ReSukiSU Stable)"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  CLANG_DIR: "prebuilts/clang/host/linux-x86/clang-r547379"

jobs:
  build-kernels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

      matrix:
        kernel:
          - name: "GKI"
            dir: "gki"
            repo: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            localver: "-YASK-GKI"
            ksu: true

          - name: "CLO"
            dir: "clo"
            repo: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            localver: "-YASK-CLO"
            ksu: true

          - name: "GKI-NoKSU"
            dir: "gki_noksu"
            repo: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            localver: "-YASK-GKI"
            ksu: false

    steps:

    # =========================
    # SETUP
    # =========================
    - name: Setup environment
      run: |
        sudo apt update -y
        sudo apt install -y git curl jq bc flex bison build-essential rsync aria2

        mkdir -p workspace output

    - name: Setup swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    # =========================
    # CLONE KERNEL
    # =========================
    - name: Clone kernel
      run: |
        git clone --depth=1 --recursive -b ${{ matrix.kernel.branch }} \
          ${{ matrix.kernel.repo }} workspace/${{ matrix.kernel.dir }}

    # =========================
    # CLANG TOOLCHAIN
    # =========================
    - name: Setup clang
      run: |
        mkdir -p prebuilts/clang/host/linux-x86

        aria2c -x 16 -s 16 -o clang.tar.gz \
          "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"

        mkdir -p $CLANG_DIR
        tar -xzf clang.tar.gz -C $CLANG_DIR
        rm -f clang.tar.gz

    # =========================
    # PATCHES
    # =========================
    - name: Apply patches
      working-directory: workspace/${{ matrix.kernel.dir }}
      run: |
        set -e

        apply_patch () {
          curl -L "$1" -o p.patch
          patch -p1 < p.patch || true
          rm -f p.patch
        }

        PATCHES=(
          "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
          "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
          "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
        )

        for p in "${PATCHES[@]}"; do
          apply_patch "$p"
        done

    # =========================
    # REZUKISU
    # =========================
    - name: Setup ReSukiSU
      if: matrix.kernel.ksu == true
      working-directory: workspace/${{ matrix.kernel.dir }}
      run: |
        set -e

        rm -rf ReSukiSU KernelSU drivers/kernelsu

        git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git

        if [ -f ReSukiSU/setup.sh ]; then
          bash ReSukiSU/setup.sh
        fi

    # =========================
    # SUSFS (SAFE)
    # =========================
    - name: SUSFS integration
      if: matrix.kernel.ksu == true
      working-directory: workspace/${{ matrix.kernel.dir }}
      run: |
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 || true

        if [ -f susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch ]; then
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true
        fi

    # =========================
    # CONFIG
    # =========================
    - name: Configure kernel
      working-directory: workspace/${{ matrix.kernel.dir }}
      run: |
        CFG=arch/arm64/configs/${{ matrix.kernel.defconfig }}

        echo "CONFIG_LOCALVERSION=\"${{ matrix.kernel.localver }}\"" >> $CFG
        echo "CONFIG_LOCALVERSION_AUTO=n" >> $CFG

        if [ "${{ matrix.kernel.ksu }}" = "true" ]; then
          cat >> $CFG << EOF
CONFIG_OVERLAY_FS=y
CONFIG_KPROBES=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
EOF
        fi

    # =========================
    # BUILD
    # =========================
    - name: Build kernel
      working-directory: workspace/${{ matrix.kernel.dir }}
      run: |
        export PATH=$PWD/../../$CLANG_DIR/bin:$PATH

        BUILD_CONFIG=build.config.gki.aarch64 \
        LTO=full \
        bash build/build.sh -j$(nproc --all)

    # =========================
    # COLLECT OUTPUT
    # =========================
    - name: Collect Image
      working-directory: workspace/${{ matrix.kernel.dir }}
      run: |
        find out/dist -name "Image*" -exec cp {} ../../output/ \;

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.kernel.name }}
        path: output/

  # =========================
  # PACKAGE STAGE
  # =========================
  package:
    runs-on: ubuntu-latest
    needs: build-kernels

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create ZIP
        run: |
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AK3

          find artifacts -type f -name "Image*" -exec cp {} AK3/ \;

          cd AK3
          zip -r9 ../YASK-ReSukiSU-STABLE.zip . -x "*.git*"

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: "YASK-ReSukiSU-STABLE"
          files: YASK-ReSukiSU-STABLE.zip
